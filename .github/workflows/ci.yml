name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nf
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NF_PG_DSN: postgresql://postgres:postgres@127.0.0.1:54329/nf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-optional.txt
      - name: Byte-compile entrypoints
        run: python -m compileall -q compaction-proxy.py folding.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Paired compaction evaluation
        run: python benchmark/paired_eval.py --limit 3
